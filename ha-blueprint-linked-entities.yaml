blueprint:
  name: Linked Entities - Source to Target
  description: >-

    **Linked Entities - Source to Target v2.0** 🔛

    This blueprint creates a unidirectional link between a source entity and a target entity.
    The target will mirror ALL changes from the source, but changes to the target will NOT affect the source.

    **Features:**
      - turn the SOURCE entity ON → TARGET turns ON
      - turn the SOURCE entity OFF → TARGET turns OFF
      - set the SOURCE brightness → TARGET brightness matches (with optional multiplier)
      - set the SOURCE color temp → TARGET color temp matches
      - set the SOURCE RGB/HS/XY color → TARGET color matches
      - set the SOURCE fan speed → TARGET fan speed matches

    **Brightness Multiplier:**
      - 100% = Target has same brightness as source
      - 50% = Target has half the brightness of source
      - 200% = Target has double the brightness of source
      - Values are clamped between 1-255 (Home Assistant brightness range)

    **Use cases:**
      - Mirror a physical switch to a virtual switch
      - Sync a smart bulb to follow another bulb (one-way)
      - Make a dashboard entity follow a real device
      - LED indicator lights that follow device states
      - Accent lighting that's dimmer than main lighting

    **IMPORTANT**: Only the source controls the target. Changes to the target are ignored.

    **CHANGELOG:**
      - 2.0: (2025-02-14)
        - Complete rewrite for unidirectional source → target control
        - Source entity only triggers automation
        - Target entity only receives commands
        - Supports all color modes (RGB, HS, XY)
        - Supports brightness, color temp, and fan speed
        - Added brightness multiplier (1-300%) for adjustable target brightness relative to source

  domain: automation
  input:
    source_entity:
      name: Source Entity
      description: The entity that controls the target. Only changes to THIS entity trigger the automation.
      selector:
        entity:
    target_entity:
      name: Target Entity
      description: The entity that mirrors the source. This entity will be controlled but will NOT trigger the automation.
      selector:
        entity:
    brightness_multiplier:
      name: Brightness Multiplier
      description: Adjusts the target's brightness relative to the source. 100% = same brightness, 50% = half brightness, 200% = double brightness. Only affects lights with brightness control.
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "%"
          mode: slider
      default: 100
    delay_miliseconds:
      name: Delay
      description: How long to delay changes to the target entity
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: miliseconds
          mode: box
      default: 200

mode: queued
max: 5
max_exceeded: silent

variables:
  source: !input source_entity
  target: !input target_entity
  brightness_pct: !input brightness_multiplier

trigger:
  - platform: state
    id: turn_on
    entity_id: !input source_entity
    from: "off"
    to: "on"
  - platform: state
    id: turn_off
    entity_id: !input source_entity
    from: "on"
    to: "off"
  - platform: state
    id: set_speed
    entity_id: !input source_entity
    attribute: percentage
  - platform: state
    id: set_brightness
    entity_id: !input source_entity
    attribute: brightness
  - platform: state
    id: set_color_temp
    entity_id: !input source_entity
    attribute: color_temp
  - platform: state
    id: set_rgb_color
    entity_id: !input source_entity
    attribute: rgb_color
  - platform: state
    id: set_hs_color
    entity_id: !input source_entity
    attribute: hs_color
  - platform: state
    id: set_xy_color
    entity_id: !input source_entity
    attribute: xy_color

condition:
  - condition: template
    value_template: "{{ trigger.to_state.context.id != this.context.id }}"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: turn_on
        sequence:
          - service: "homeassistant.turn_on"
            target:
              entity_id: !input target_entity
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: turn_off
        sequence:
          - service: "homeassistant.turn_off"
            target:
              entity_id: !input target_entity
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_speed
        sequence:
          - variables:
              set_fan_speed: "{{ trigger.to_state.attributes.percentage }}"
          - service: fan.set_percentage
            target:
              entity_id: !input target_entity
            data:
              percentage: "{{ set_fan_speed }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_brightness
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input target_entity
            data:
              brightness: >-
                {% set master_brightness = trigger.to_state.attributes.brightness | int %}
                {% set result = (master_brightness * brightness_pct / 100) | round(0) | int %}
                {% if result < 1 %}
                  1
                {% elif result > 255 %}
                  255
                {% else %}
                  {{ result }}
                {% endif %}
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_color_temp
        sequence:
          - variables:
              set_light_color_temp: "{{ trigger.to_state.attributes.color_temp }}"
          - service: light.turn_on
            target:
              entity_id: !input target_entity
            data:
              color_temp: "{{ set_light_color_temp }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_rgb_color
        sequence:
          - variables:
              set_light_rgb_color: "{{ trigger.to_state.attributes.rgb_color }}"
          - service: light.turn_on
            target:
              entity_id: !input target_entity
            data:
              rgb_color: "{{ set_light_rgb_color }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_hs_color
        sequence:
          - variables:
              set_light_hs_color: "{{ trigger.to_state.attributes.hs_color }}"
          - service: light.turn_on
            target:
              entity_id: !input target_entity
            data:
              hs_color: "{{ set_light_hs_color }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_xy_color
        sequence:
          - variables:
              set_light_xy_color: "{{ trigger.to_state.attributes.xy_color }}"
          - service: light.turn_on
            target:
              entity_id: !input target_entity
            data:
              xy_color: "{{ set_light_xy_color }}"
          - delay:
              milliseconds: !input delay_miliseconds
