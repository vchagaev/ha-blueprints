blueprint:
  name: Linked Entities (Enhanced with Color Sync)
  description: >-

    [![Open your Home Assistant instance and show the blueprint import dialog with a specific blueprint pre-filled.](https://my.home-assistant.io/badges/blueprint_import.svg)](https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=https%3A%2F%2Fraw.githubusercontent.com%2Falexdelprete%2Fha-blueprints%2Fmain%2Fha-blueprint-linked-entities.yaml)

    **Linked Entities v1.4 (Enhanced)** 🔛

    This blueprint allows you to easily create/maintain an automation that links the state of multiple entities:
      - turn ANY linked entity ON, it will turn ON ALL linked entities.
      - turn ANY linked entity OFF, it will turn OFF ALL linked entities.
      - set the brightness of any light entity, it will set the same brightness of ALL linked light entities.
      - set the color temp of any light entity, it will set the same color temperature of ALL linked light entities.
      - **set the RGB color of any light entity, it will set the same RGB color of ALL linked light entities.**
      - **set the HSV color of any light entity, it will set the same HSV color of ALL linked light entities.**
      - **set the XY color of any light entity, it will set the same XY color of ALL linked light entities.**
      - set the speed (percentage) of any fan entity, it will set the speed of ALL linked fan entities.

    **NOTE**: You can select any entity with an ON/OFF state (switches, lights, etc.), lights with brightness, color temperature, or color attributes, and Fans with speed (percentage) attributes.

    My main use-case was for multiple light switches in the house controlling the same light, but I also use it for other things:
      - at dawn, when I turn on the external lights (a shelly switch), I also link the pool light mqtt switch.
      - when I want to open the external gate, I can use several linked switches in multiple rooms of the house
      - when I want to manually turn on/off the irrigation system, I use two switches (internal and external) to activate my RainMachine cycle

    I'm sure you'll find many more use-cases. :slight_smile:

    **CHANGELOG:**
      - 1.4: (2025-02-14 - Enhanced version with color sync)
        - Added support for RGB color syncing
        - Added support for HSV color syncing
        - Added support for XY color syncing
        - Fixed issue where changing brightness and color simultaneously would only sync one attribute
        - Changed to single state trigger that handles all attribute changes in one action
      - 1.3: (2024-07-10 - thanks @jsenecal for PR #2)
        - Ignore changes to entities triggered by this automation
        - Do not change the state of the entity triggering the automation
      - 1.2: (2024-01-28 - thanks @phrak / @TimU for PR #1)
        - Changed the action to a "Choose" building block to support fan, light and future attributes
        - Added support for linked fan speeds
        - Added support for linked light brightness and light color temperature
      - 1.1: (2024-01-09)
        - Optimized service call leveraging trigger.id
        - Introduced max_exceeded to avoid warnings in log due to possible self-triggering
        - Introduced a small delay after the service call to throttle the automation
      - 1.0: (2023-12-29)
        - First official release

    **If you like to show your support please hit click here:**
    [![contributions - welcome](https://img.shields.io/badge/contributions-welcome-blue)](https://www.paypal.com/donate/?hosted_button_id=8V9YE6S5E869G "PayPal Donation")

    **Source:**
    [![alexdelprete - ha-blueprints](https://img.shields.io/static/v1?label=alexdelprete&message=ha-blueprints&color=blue&logo=github)](https://github.com/alexdelprete/ha-blueprints/blob/main/ha-blueprint-linked-entities.yaml "Go to GitHub repo") [![stars - ha-blueprints](https://img.shields.io/github/stars/alexdelprete/ha-blueprints?style=social)](https://github.com/alexdelprete/ha-blueprints) [![forks - ha-blueprints](https://img.shields.io/github/forks/alexdelprete/ha-blueprints?style=social)](https://github.com/alexdelprete/ha-blueprints)

    **Support:**
    [![HA Community - Topic](https://img.shields.io/static/v1?label=HA+Community&message=Topic&color=2ea44f&logo=home-assistant)](https://community.home-assistant.io/t/linked-entities-keep-mutlple-entities-binary-state-in-sync-lights-switches-etc/662836?u=alexdelprete)

  domain: automation
  input:
    linked_entity:
      name: Linked Entities
      description: Entities whose state and attributes will be linked (if any of them transitions to ON state, all will be ON. Same for the OFF, BRIGHTNESS, COLOR_TEMP, RGB_COLOR, HS_COLOR, XY_COLOR, and SPEED states).
      selector:
        entity:
          multiple: true
    delay_miliseconds:
      name: Delay
      description: How long to delay changes to linked entities
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: miliseconds
          mode: box
      default: 200

mode: single
max_exceeded: silent

variables:
  linked_entities: !input linked_entity

trigger:
  - platform: state
    entity_id: !input linked_entity

condition:
  - condition: template
    value_template: "{{ trigger.to_state.context.id != this.context.id }}"
  - condition: template
    value_template: >-
      {{ trigger.from_state.state != trigger.to_state.state or
         trigger.from_state.attributes.brightness != trigger.to_state.attributes.brightness or
         trigger.from_state.attributes.color_temp != trigger.to_state.attributes.color_temp or
         trigger.from_state.attributes.rgb_color != trigger.to_state.attributes.rgb_color or
         trigger.from_state.attributes.hs_color != trigger.to_state.attributes.hs_color or
         trigger.from_state.attributes.xy_color != trigger.to_state.attributes.xy_color or
         trigger.from_state.attributes.percentage != trigger.to_state.attributes.percentage }}

action:
  - choose:
      # Handle on/off state changes
      - conditions:
          - condition: template
            value_template: "{{ trigger.from_state.state == 'off' and trigger.to_state.state == 'on' }}"
        sequence:
          - service: "homeassistant.turn_on"
            target:
              entity_id: "{{ linked_entities | reject('eq', trigger.entity_id) | list }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: template
            value_template: "{{ trigger.from_state.state == 'on' and trigger.to_state.state == 'off' }}"
        sequence:
          - service: "homeassistant.turn_off"
            target:
              entity_id: "{{ linked_entities | reject('eq', trigger.entity_id) | list }}"
          - delay:
              milliseconds: !input delay_miliseconds
      # Handle fan speed changes
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.percentage is defined and trigger.from_state.attributes.percentage != trigger.to_state.attributes.percentage }}"
        sequence:
          - service: fan.set_percentage
            target:
              entity_id: "{{ linked_entities | reject('eq', trigger.entity_id) | list }}"
            data:
              percentage: "{{ trigger.to_state.attributes.percentage }}"
          - delay:
              milliseconds: !input delay_miliseconds
      # Handle light attribute changes (brightness, color, color_temp)
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.to_state.attributes.brightness is defined or
                 trigger.to_state.attributes.color_temp is defined or
                 trigger.to_state.attributes.rgb_color is defined or
                 trigger.to_state.attributes.hs_color is defined or
                 trigger.to_state.attributes.xy_color is defined }}
          - condition: template
            value_template: >-
              {{ trigger.from_state.attributes.brightness != trigger.to_state.attributes.brightness or
                 trigger.from_state.attributes.color_temp != trigger.to_state.attributes.color_temp or
                 trigger.from_state.attributes.rgb_color != trigger.to_state.attributes.rgb_color or
                 trigger.from_state.attributes.hs_color != trigger.to_state.attributes.hs_color or
                 trigger.from_state.attributes.xy_color != trigger.to_state.attributes.xy_color }}
        sequence:
          - service: light.turn_on
            target:
              entity_id: "{{ linked_entities | reject('eq', trigger.entity_id) | list }}"
            data: >-
              {% set data = {} %}
              {% if trigger.to_state.attributes.brightness is defined and trigger.from_state.attributes.brightness != trigger.to_state.attributes.brightness %}
                {% set data = dict(data, brightness=trigger.to_state.attributes.brightness) %}
              {% endif %}
              {% set color_changed = trigger.from_state.attributes.rgb_color != trigger.to_state.attributes.rgb_color or
                                      trigger.from_state.attributes.hs_color != trigger.to_state.attributes.hs_color or
                                      trigger.from_state.attributes.xy_color != trigger.to_state.attributes.xy_color %}
              {% if color_changed %}
                {% if trigger.to_state.attributes.rgb_color is defined and trigger.from_state.attributes.rgb_color != trigger.to_state.attributes.rgb_color %}
                  {% set data = dict(data, rgb_color=trigger.to_state.attributes.rgb_color) %}
                {% elif trigger.to_state.attributes.hs_color is defined and trigger.from_state.attributes.hs_color != trigger.to_state.attributes.hs_color %}
                  {% set data = dict(data, hs_color=trigger.to_state.attributes.hs_color) %}
                {% elif trigger.to_state.attributes.xy_color is defined and trigger.from_state.attributes.xy_color != trigger.to_state.attributes.xy_color %}
                  {% set data = dict(data, xy_color=trigger.to_state.attributes.xy_color) %}
                {% endif %}
              {% elif trigger.to_state.attributes.color_temp is defined and trigger.from_state.attributes.color_temp != trigger.to_state.attributes.color_temp %}
                {% set data = dict(data, color_temp=trigger.to_state.attributes.color_temp) %}
              {% endif %}
              {{ data }}
          - delay:
              milliseconds: !input delay_miliseconds
