blueprint:
  name: Master-Slave Linked Entities
  description: >-

    **Master-Slave Linked Entities v2.0** 🔛

    This blueprint creates a unidirectional link between a master entity and a slave entity.
    The slave will mirror ALL changes from the master, but changes to the slave will NOT affect the master.

    **Features:**
      - turn the MASTER entity ON → SLAVE turns ON
      - turn the MASTER entity OFF → SLAVE turns OFF
      - set the MASTER brightness → SLAVE brightness matches
      - set the MASTER color temp → SLAVE color temp matches
      - set the MASTER RGB/HS/XY color → SLAVE color matches
      - set the MASTER fan speed → SLAVE fan speed matches

    **Use cases:**
      - Mirror a physical switch to a virtual switch
      - Sync a smart bulb to follow another bulb (one-way)
      - Make a dashboard entity follow a real device
      - LED indicator lights that follow device states

    **IMPORTANT**: Only the master controls the slave. Changes to the slave are ignored.

    **CHANGELOG:**
      - 2.0: (2025-02-14)
        - Complete rewrite for unidirectional master → slave control
        - Master entity only triggers automation
        - Slave entity only receives commands
        - Supports all color modes (RGB, HS, XY)
        - Supports brightness, color temp, and fan speed

  domain: automation
  input:
    master_entity:
      name: Master Entity
      description: The entity that controls the slave. Only changes to THIS entity trigger the automation.
      selector:
        entity:
    slave_entity:
      name: Slave Entity
      description: The entity that mirrors the master. This entity will be controlled but will NOT trigger the automation.
      selector:
        entity:
    delay_miliseconds:
      name: Delay
      description: How long to delay changes to the slave entity
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: miliseconds
          mode: box
      default: 200

mode: queued
max: 5
max_exceeded: silent

variables:
  master: !input master_entity
  slave: !input slave_entity

trigger:
  - platform: state
    id: turn_on
    entity_id: !input master_entity
    from: "off"
    to: "on"
  - platform: state
    id: turn_off
    entity_id: !input master_entity
    from: "on"
    to: "off"
  - platform: state
    id: set_speed
    entity_id: !input master_entity
    attribute: percentage
  - platform: state
    id: set_brightness
    entity_id: !input master_entity
    attribute: brightness
  - platform: state
    id: set_color_temp
    entity_id: !input master_entity
    attribute: color_temp
  - platform: state
    id: set_rgb_color
    entity_id: !input master_entity
    attribute: rgb_color
  - platform: state
    id: set_hs_color
    entity_id: !input master_entity
    attribute: hs_color
  - platform: state
    id: set_xy_color
    entity_id: !input master_entity
    attribute: xy_color

condition:
  - condition: template
    value_template: "{{ trigger.to_state.context.id != this.context.id }}"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: turn_on
        sequence:
          - service: "homeassistant.turn_on"
            target:
              entity_id: !input slave_entity
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: turn_off
        sequence:
          - service: "homeassistant.turn_off"
            target:
              entity_id: !input slave_entity
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_speed
        sequence:
          - variables:
              set_fan_speed: "{{ trigger.to_state.attributes.percentage }}"
          - service: fan.set_percentage
            target:
              entity_id: !input slave_entity
            data:
              percentage: "{{ set_fan_speed }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_brightness
        sequence:
          - variables:
              set_light_brightness: "{{ trigger.to_state.attributes.brightness }}"
          - service: light.turn_on
            target:
              entity_id: !input slave_entity
            data:
              brightness: "{{ set_light_brightness }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_color_temp
        sequence:
          - variables:
              set_light_color_temp: "{{ trigger.to_state.attributes.color_temp }}"
          - service: light.turn_on
            target:
              entity_id: !input slave_entity
            data:
              color_temp: "{{ set_light_color_temp }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_rgb_color
        sequence:
          - variables:
              set_light_rgb_color: "{{ trigger.to_state.attributes.rgb_color }}"
          - service: light.turn_on
            target:
              entity_id: !input slave_entity
            data:
              rgb_color: "{{ set_light_rgb_color }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_hs_color
        sequence:
          - variables:
              set_light_hs_color: "{{ trigger.to_state.attributes.hs_color }}"
          - service: light.turn_on
            target:
              entity_id: !input slave_entity
            data:
              hs_color: "{{ set_light_hs_color }}"
          - delay:
              milliseconds: !input delay_miliseconds
      - conditions:
          - condition: trigger
            id: set_xy_color
        sequence:
          - variables:
              set_light_xy_color: "{{ trigger.to_state.attributes.xy_color }}"
          - service: light.turn_on
            target:
              entity_id: !input slave_entity
            data:
              xy_color: "{{ set_light_xy_color }}"
          - delay:
              milliseconds: !input delay_miliseconds
